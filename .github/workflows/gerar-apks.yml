name: Gerar APKs - HD Launcher e The Cars HD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Gerar ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: HD Launcher Mobile
            pasta: hd-launcher-mobile
            artefato: HD-Launcher-Mobile-APK
          - nome: The Cars HD
            pasta: the-cars-hd
            artefato: The-Cars-HD-APK
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        working-directory: ${{ matrix.pasta }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefato }}
          path: ${{ matrix.pasta }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
